# OpenSSF Scorecard: an outside check of how the PROJECT is run - are the
# build's actions pinned, are dependencies watched, is there a security
# policy, can a release be tampered with. Results go to the Security tab
# and to scorecard.dev. The badge is NOT on the site or the README yet: a
# days-old, one-person repo scores low on things like code review and
# branch protection, and a low number beside a download button says the
# wrong thing. Look at the score first.
name: scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '41 5 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: results.sarif
