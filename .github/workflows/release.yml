# Builds the Windows installer and publishes it as a GitHub release.
#
# Push a tag that matches the version in package.json:
#
#   npm version patch        (bumps package.json, commits, tags vX.Y.Z)
#   git push origin master --follow-tags
#
# The build does NOT publish. electron-builder's own uploader was tried
# first (v0.2.0) and raced itself: it made TWO releases for the one tag and
# split the files between them, so the download link led to the one with
# no installer in it. Here the files are built, and then ONE release is
# made from them with GitHub's own CLI. latest.yml goes up with the
# installer: it is the file the installed app reads to learn that there is
# a newer version. The only credential is the token GitHub gives this
# workflow itself.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write       # for the attestation
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional. With it, every installer is sent to VirusTotal and the release
      # notes link to the report; without it, nothing is sent and nothing breaks.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The tag must be the version being built
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME, package.json $want"; exit 1; fi
      - run: npm run dist
      # GitHub signs a statement that THIS workflow built THIS file from THIS
      # commit; anybody can check it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.exe
      - name: One release, made once
        shell: bash
        run: |
          # Anything already published under this tag is a failed attempt.
          for tag in "$GITHUB_REF_NAME"; do
            while gh release view "$tag" >/dev/null 2>&1; do gh release delete "$tag" --yes; done
          done
          # The installer's fingerprint, in the release notes, for anybody who
          # wants to compare it with the file they were given.
          sum=$(sha256sum dist/*.exe | cut -d" " -f1)
          # The same file, looked at by ~70 antivirus engines, for anybody who
          # would rather not take one stranger's word. A file this size goes to
          # an upload address VirusTotal hands out. NEVER fails the release.
          vt=""
          if [ -n "$VT_API_KEY" ]; then
            url=$(curl -fsS -m 60 -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).data" || true)
            if [ -n "$url" ] && curl -fsS -m 900 -H "x-apikey: $VT_API_KEY" -F "file=@$(ls dist/*.exe | head -1)" "$url" >/dev/null; then
              vt="https://www.virustotal.com/gui/file/$sum"
            else
              echo "::warning::VirusTotal upload did not go through; the release goes out without the link"
            fi
          fi
          {
            echo "SHA-256 of Dota-Translator-Setup.exe:"
            echo
            echo "    $sum"
            echo
            if [ -n "$vt" ]; then echo "Antivirus report for exactly this file (VirusTotal): $vt"; echo; fi
            echo "Built by GitHub Actions from this tag, not on anybody's PC. To check the file you downloaded:"
            echo
            echo "    gh attestation verify Dota-Translator-Setup.exe --repo sc0rebreaker/dota-translator"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Dota Translator ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml
